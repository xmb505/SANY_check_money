[filter]
# 设备名过滤关键字，equipmentName 中包含此字符串的设备才纳入统计
# 可用逗号分隔多个关键字（满足任意一个即可），如: 室电表,宿舍电表
device_name_filter = 室电表

[align]
# 整点对齐阈值（分钟）
# 某条原始读数距离最近整点不超过此值，才视为该整点的"直接数据"
# 建议不超过 30，避免相邻整点窗口重叠
align_threshold_minutes = 29

[output]
# 输出目录（相对路径基于程序所在目录，也可写绝对路径）
output_dir = ./output

# 输出文件名模板，支持以下占位符：
#   {date}   -> 目标日期，格式 YYYYMMDD，如 20260416
#   {mode}   -> 计时制，值为 24h 或 30h
# 示例: {date}_{mode}.csv  ->  20260416_24h.csv
filename_template = {date}_{mode}.csv

# 默认输出的小时制，可选值：24 / 30
# CLI 参数 --mode 可覆盖此设置
default_mode = 24

# 数据输出类型，可选值：
#   reading -> 每小时的累计总量（total_reading）
#   usage   -> 每小时的用量（当前整点 - 上一整点，差值）
output_type = usage

[filter_output]
# missing 超过此值的设备行直接丢弃（数据太少，无意义）
max_missing_count = 10

# 全天用量低于此阈值的设备行直接丢弃（24小时制）
min_usage_24h = 0.7

# 全天用量低于此阈值的设备行直接丢弃（30小时制）
min_usage_30h = 1.0
